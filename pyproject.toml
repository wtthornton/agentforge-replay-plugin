[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-replay-plugin"
version = "1.0.0"
description = "Event-store replay rig for AgentForge. Deterministic write/query test surface for the plugin system (TAP-770)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
]

[project.entry-points."agentforge.plugins"]
replay-test = "agentforge_replay"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_replay"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_replay/plugin.json" = "agentforge_replay/plugin.json"
"agentforge_replay/agents/replay_test_agent/AGENT.md" = "agentforge_replay/agents/replay_test_agent/AGENT.md"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "aiosqlite>=0.19",
]
